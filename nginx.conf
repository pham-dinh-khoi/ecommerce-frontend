server {
    # Default port for HTTP traffic
    listen 80;

    # Matches all requests; acts as the default server block for this Nginx instance
    server_name _;

    # Root directory where the static build artifacts (HTML/JS/CSS) are located
    root /usr/share/nginx/html;

    # The entry point file for the application
    index index.html;

    # ---- Gzip Compression ----
    # Compresses responses to reduce bandwidth usage and improve Time to First Byte (TTFB).
    gzip on;
    
    # Restricts compression to specific MIME types to avoid wasting CPU on files 
    # that are already compressed (like images) or too small to benefit.
    gzip_types text/css application/javascript application/json image/svg+xml;
    
    # Sets the threshold to prevent compressing tiny files, where the overhead 
    # of the compression headers might outweigh the actual file size reduction.
    gzip_min_length 1000;

    # ---- Static Assets Caching ----
    # Optimized for modern build tools (Vite/Webpack) that generate hashed filenames.
    location /assets/ {
        # Sets the 'Expires' header to 1 year, instructing the browser to cache these files aggressively.
        expires 1y;
        
        # 'public': allows caching by proxies/CDNs.
        # 'immutable': explicitly tells the browser the file will never change, 
        # bypassing revalidation requests entirely (improving performance).
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA Routing Fallback ----
    # Essential for Single Page Applications (SPAs) that use client-side routing.
    location / {
        # 'try_files' directive logic:
        # 1. Checks if the request maps to a physical file ($uri).
        # 2. Checks if it maps to a directory ($uri/).
        # 3. If no physical resource is found, fallback to /index.html.
        # This prevents 404 errors when navigating directly to a deep URL 
        # (e.g., /dashboard/settings), allowing the JavaScript router to handle the route.
        try_files $uri $uri/ /index.html;
    }
}